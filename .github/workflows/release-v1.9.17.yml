name: Publish offline v1.9.17 APK
on:
  push:
    tags:
      - v1.9.17
permissions:
  contents: write
concurrency:
  group: release-v1.9.17
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'RonMao-working/photoswipe'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify and publish delivered offline APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/release_v1917.py
